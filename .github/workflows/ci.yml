name: CI

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA as tag
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t $REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.tag }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push image
        run: docker push $REGISTRY/$IMAGE_NAME:${{ steps.meta.outputs.tag }}

  update-gitops-repo:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout gitops-config repo
        uses: actions/checkout@v4
        with:
          repository: Hiba-Farah/gitops-canary-config
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-config

      - name: Update image tag in dev manifest
        run: |
          cd gitops-config
          sed -i "s|image: .*gitops-canary-app.*|image: ghcr.io/hiba-farah/gitops-canary-app:${{ needs.build-and-push.outputs.image_tag }}|" apps/dev/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/dev/deployment.yaml
          git commit -m "Update dev image to ${{ needs.build-and-push.outputs.image_tag }}" || echo "No changes"
          git push
