name: CI

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set tag and lowercase image name
        id: meta
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t $REGISTRY/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Push image
        run: docker push $REGISTRY/${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}

  update-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout gitops-config repo
        uses: actions/checkout@v4
        with:
          repository: Hiba-Farah/gitops-canary-config
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-config

      - name: Update image tag in dev manifest
        run: |
          cd gitops-config
          sed -i "s|image: .*gitops-canary-app.*|image: ghcr.io/${{ needs.build-and-push.outputs.image_name }}:${{ needs.build-and-push.outputs.image_tag }}|" apps/dev/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/dev/deployment.yaml
          git commit -m "Update dev image to ${{ needs.build-and-push.outputs.image_tag }}" || echo "No changes"
          git push

  update-staging:
    runs-on: ubuntu-latest
    needs: [build-and-push, update-dev]
    steps:
      - name: Checkout gitops-config repo
        uses: actions/checkout@v4
        with:
          repository: Hiba-Farah/gitops-canary-config
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-config

      - name: Update image tag in staging manifest
        run: |
          cd gitops-config
          sed -i "s|image: .*gitops-canary-app.*|image: ghcr.io/${{ needs.build-and-push.outputs.image_name }}:${{ needs.build-and-push.outputs.image_tag }}|" apps/staging/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/staging/deployment.yaml
          git commit -m "Promote ${{ needs.build-and-push.outputs.image_tag }} to staging" || echo "No changes"
          git push

  promote-to-prod:
    runs-on: ubuntu-latest
    needs: [build-and-push, update-staging]
    steps:
      - name: Checkout gitops-config repo
        uses: actions/checkout@v4
        with:
          repository: Hiba-Farah/gitops-canary-config
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-config

      - name: Update image tag in prod rollout (keep APP_VERSION/FAIL_RATE as-is)
        run: |
          cd gitops-config
          sed -i "s|image: .*gitops-canary-app.*|image: ghcr.io/${{ needs.build-and-push.outputs.image_name }}:${{ needs.build-and-push.outputs.image_tag }}|" apps/prod/rollout.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add apps/prod/rollout.yaml
          git commit -m "Promote ${{ needs.build-and-push.outputs.image_tag }} to prod via canary" || echo "No changes"
          git push
